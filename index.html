<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a7d6c">
<title>Événements Canggu</title>
<style>
:root{--bg:#f6f7f6;--panel:#fff;--text:#1b1d1c;--muted:#5f6a66;--line:#e1e5e3;--accent:#0a7d6c;--on-accent:#fff;--accent-soft:#e2f2ee;--hi:#c8ecd9;--hi-t:#0b5d33;--md:#fff0c2;--md-t:#6e5100;--lo:#f6d5d5;--lo-t:#8a1f1f;--link:#0a5fa8;--live:#c4302b;--live-t:#fff;--shadow:0 8px 28px rgba(0,0,0,.16);--tb-h:0px}
@media (prefers-color-scheme:dark){:root{--bg:#111413;--panel:#1a1e1d;--text:#e5eae8;--muted:#9aa5a1;--line:#2b3230;--accent:#3cc2ab;--on-accent:#06201b;--accent-soft:#17352f;--hi:#1d4a33;--hi-t:#a6f0c6;--md:#4a3d12;--md-t:#ffe08a;--lo:#4d2222;--lo-t:#ffb4b4;--link:#7ab8ff;--live:#ff7a6e;--live-t:#2a0603;--shadow:0 8px 28px rgba(0,0,0,.6)}}
html{color-scheme:light dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(var(--tb-h) + 16px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- en-tête ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 12px 4px;max-width:1500px;margin:auto}
h1{font-size:17px;margin:0;line-height:1.2}
h1 small{display:block;font-size:12.5px;font-weight:400;color:var(--muted);margin-top:2px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none;background:var(--panel)}
.lang button{border:0;background:none;min-width:44px;height:40px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.help{max-width:1500px;margin:0 auto;padding:0 12px 6px;font-size:13px;color:var(--muted)}
.help summary{cursor:pointer;width:max-content;padding:4px 0}
.help p{margin:4px 0 6px}

/* ---------- barre collante ---------- */
.tb{transition:transform .2s ease;position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0 6px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.tb-in{max-width:1500px;margin:auto;padding:0 12px;display:flex;flex-direction:column;gap:8px}
.r1{display:flex;gap:8px}
.sbox{position:relative;flex:1;min-width:0}
.sbox input{width:100%;height:44px;padding:0 40px 0 38px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font:inherit;font-size:16px;-webkit-appearance:none}
.sbox input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.sbox .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.sbox .clr{position:absolute;right:2px;top:2px;width:40px;height:40px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;border-radius:10px}
.fbtn{flex:none;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.fbtn.on{border-color:var(--accent);color:var(--accent)}
.fbtn .n{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:12px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 5px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px;scroll-padding:0 12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:0 14px;cursor:pointer;font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip.q{border-style:dashed}
.sep{flex:none;width:1px;background:var(--line);margin:6px 2px}
.r3{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px;min-height:24px}
.r3::-webkit-scrollbar{display:none}
.count{flex:none;color:var(--muted);font-size:13px;white-space:nowrap}
.af{display:flex;gap:6px}
.af button{flex:none;min-height:30px;border:0;background:var(--accent-soft);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.af b{color:var(--accent);font-weight:600}
.desk{display:none}
.tb.hide{transform:translateY(-100%)}
.cday{transition:top .2s ease}

main{max-width:1500px;margin:8px auto 80px;padding:0 12px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty button{margin-top:12px}

/* ---------- cartes (mobile d'abord) ---------- */
.cday{position:sticky;top:var(--tb-h);z-index:5;background:var(--bg);font-weight:700;font-size:15px;padding:12px 2px 8px;margin:0 0 8px;border-bottom:2px solid var(--accent)}
.cday span{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:6px}
.cards{list-style:none;margin:0;padding:0}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.card:active{border-color:var(--accent)}
.card.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.past{opacity:.55}
.card:not(.open){content-visibility:auto;contain-intrinsic-size:auto 170px}
.c1{display:flex;align-items:center;gap:8px;min-height:32px;padding-right:84px}
.time{font-weight:700;font-variant-numeric:tabular-nums;font-size:14.5px}
.cright{position:absolute;top:6px;right:4px;display:flex;align-items:center;gap:2px}
.c2{display:block;width:100%;border:0;background:none;padding:0;margin:2px 0 2px;text-align:left;cursor:pointer;font-weight:700;font-size:16.5px;line-height:1.3}
.c3{color:var(--muted);font-size:13.5px}
.c4{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.c5{display:flex;gap:12px;margin-top:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.c5 .sc{margin-left:4px}
.tag{display:inline-flex;align-items:center;height:24px;border-radius:6px;padding:0 8px;font-size:12.5px;background:var(--line);white-space:nowrap}
.tag.price{background:var(--accent-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.d-c{background:#2e9e5b}.d-p{background:#d9a400}.d-v{background:#d9534f}
.st{display:inline-block;font-size:11.5px;font-weight:700;border-radius:5px;padding:1px 6px;white-space:nowrap}
.st.live{background:var(--live);color:var(--live-t)}.st.soon{background:var(--md);color:var(--md-t)}
.sc{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:1px 4px;font-weight:700;font-variant-numeric:tabular-nums}
.sc.hi{background:var(--hi);color:var(--hi-t)}.sc.md{background:var(--md);color:var(--md-t)}.sc.lo{background:var(--lo);color:var(--lo-t)}.sc.na{color:var(--muted)}
.sc.big{min-width:38px;font-size:14px;padding:3px 6px;border-radius:8px}
.fav{border:0;background:none;cursor:pointer;font-size:22px;line-height:1;color:var(--muted);width:44px;height:44px;border-radius:10px}
.fav[aria-pressed=true]{color:#e3a400}
.detg{display:grid;grid-template-columns:1fr;gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);cursor:auto}
.detg p{margin:0 0 8px}
.k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 2px!important;font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.acts a,.acts button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;font-size:14px;color:var(--text);text-decoration:none;text-align:center}
.acts .pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.links a{display:inline-block;padding:4px 0}

/* ---------- panneau de filtres ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
.sheet{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:90vh;background:var(--panel);border-radius:18px 18px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 8px 16px;border-bottom:1px solid var(--line)}
.sh-h b{font-size:16px}
.sh-h button{width:44px;height:44px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
.sh-b{overflow:auto;padding:4px 16px 16px;overscroll-behavior:contain}
.sec{padding:12px 0 4px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center}
.sec h3 button{border:0;background:none;color:var(--link);font-size:12.5px;text-transform:none;letter-spacing:0;cursor:pointer;padding:6px 0 6px 10px}
.pills{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:8px}
.pill{min-height:40px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:0 14px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pill .n{color:var(--muted);font-size:12px}
.pill[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill[aria-pressed=true] .n{color:inherit;opacity:.8}
.pill.zero{opacity:.45}
.tgl{display:flex;align-items:center;justify-content:space-between;min-height:44px;cursor:pointer;font-size:15px}
.tgl input{width:22px;height:22px;accent-color:var(--accent)}
.sh-f{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 16px;border-top:1px solid var(--line)}
.sh-f button{height:48px;border-radius:12px;cursor:pointer;font-weight:600;font-size:15px;padding:0 16px}
.sh-f .ghost{border:1px solid var(--line);background:var(--panel)}
.sh-f .go{border:0;background:var(--accent);color:var(--on-accent)}

/* ---------- popover de colonne (bureau) ---------- */
.pop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:290px;display:flex;flex-direction:column;max-height:70vh}
.pop .ph{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pop .ph input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit;font-size:14px}
.pop .pa{display:flex;gap:6px}
.pop .pa button{border:1px solid var(--line);background:none;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px;color:var(--link)}
.pop .pl{overflow:auto;padding:4px 12px}
.pop label{display:flex;gap:10px;align-items:center;min-height:32px;cursor:pointer;font-size:13.5px}
.pop label input{width:16px;height:16px;accent-color:var(--accent)}
.pop label .n{margin-left:auto;color:var(--muted);font-size:12px}
.pop label.zero{opacity:.45}
.pop .pf{padding:10px 12px;border-top:1px solid var(--line)}
.pop .pf button{width:100%;border:0;background:var(--accent);color:var(--on-accent);border-radius:8px;padding:9px;cursor:pointer;font-weight:600}

/* ---------- bureau ---------- */
@media (min-width:900px){
 body{font-size:14px}
 .top{padding:16px 16px 4px}h1{font-size:20px}
 .help,.tb-in,main{padding-left:16px;padding-right:16px}
 .chips,.r3{margin:0;padding:0}
 .r1{max-width:none}
 .sbox{max-width:420px}
 .desk{display:inline-flex}
 .qb{height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;font-size:14px;white-space:nowrap}
 .qb.on{border-color:var(--accent);color:var(--accent);font-weight:600}
 .r1 .count{margin-left:auto;align-self:center}
 .sheet{left:auto;top:0;bottom:0;width:400px;max-height:none;border-radius:0}
 table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
 thead th{position:sticky;top:var(--tb-h);z-index:10;background:var(--accent-soft);text-align:left;padding:0;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
 thead th:first-child{border-top-left-radius:10px}thead th:last-child{border-top-right-radius:10px}
 th .h{display:flex;align-items:center}
 th .sort{flex:1;border:0;background:none;padding:10px 2px 10px 8px;text-align:left;cursor:pointer;font-weight:600}
 th .sort:hover{color:var(--accent)}
 th .arr{color:var(--accent);font-size:10px;margin-left:3px}
 th .fb{border:0;background:none;color:var(--muted);cursor:pointer;min-width:28px;height:32px;border-radius:6px;font-size:12px}
 th .fb:hover{background:var(--panel)}
 th .fb.on{color:var(--accent);font-weight:700}
 tr.day td{position:sticky;top:calc(var(--tb-h) + 39px);z-index:5;background:var(--bg);font-weight:700;font-size:15px;padding:12px 10px 6px;border-bottom:2px solid var(--accent)}
 tr.day span{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:6px}
 td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
 tr.ev{cursor:pointer}
 tr.ev:hover td{background:var(--accent-soft)}
 tr.ev.past td{opacity:.5}
 tr.ev.open td{background:var(--accent-soft);border-bottom-color:transparent}
 td.when{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
 td.when small{display:block;color:var(--muted);font-weight:400}
 .nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
 .namebtn{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-weight:700;font-size:14px;line-height:1.3}
 .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
 td .fav{width:34px;height:34px;font-size:18px}
 tr.det td{background:var(--accent-soft);padding:0 16px 16px;cursor:auto}
 tr.det .detg{grid-template-columns:1.3fr 1fr;gap:24px;max-width:1150px;margin-top:0;border-top:0}
 .acts{display:flex;flex-wrap:wrap}
 .acts a,.acts button{min-height:38px}
 .qb{display:inline-flex;align-items:center}
 .r3{flex-wrap:wrap;overflow:visible}.af{flex-wrap:wrap}
 .r3 .count{display:none}
 .r3:has(.af:empty){display:none}
}
@media (min-width:900px) and (max-width:1199px){
 tr.ev>td:nth-child(12),thead th:nth-child(12){display:none}
 th .sort{padding:10px 0 10px 6px}th .fb{min-width:22px}td{padding:8px 5px}
}
</style>
</head>

  <h1 id="title"></h1>
  <div class="lang" role="group" aria-label="Language"><button data-l="fr">FR</button><button data-l="en">EN</button></div>
</div>

</div></div>
<main id="main"></main>

try{const s=JSON.parse(localStorage.getItem('cgg-state4')||'null');if(s){Object.assign(state,{sort:s.sort||DEF_SORT(),q:s.q||'',quick:s.quick||null,favOnly:!!s.favOnly,hidePast:s.hidePast!==false});state.filters=Object.fromEntries(Object.entries(s.filters||{}).filter(([k])=>DIMS[k]).map(([k,v])=>[k,new Set(v)]))}favs=new Set(JSON.parse(localStorage.getItem('cgg-favs')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('cgg-state4',JSON.stringify({sort:state.sort,q:state.q,quick:state.quick,favOnly:state.favOnly,hidePast:state.hidePast,filters:Object.fromEntries(Object.entries(state.filters).map(([k,v])=>[k,[...v]]))}));localStorage.setItem('cgg-favs',JSON.stringify([...favs]));localStorage.setItem('cgg-lang',lang)}catch(e){}};

function dayLabel(date,short){const d=new Date(date+'T12:00:00Z');return new Intl.DateTimeFormat(lang==='fr'?'fr-FR':'en-GB',short?{weekday:'short',day:'numeric',timeZone:'UTC'}:{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'}).format(d).replace(/^./,c=>c.toUpperCase())}

function qTerms(){const q=norm(state.q).replace(/ +/g,' ');const w=q.trim().split(' ').filter(Boolean);if(!w.length)return null;
 const L=q.startsWith(' '),R=q.endsWith(' ');
 return w.map((x,i)=>(i>0||L?' ':'')+x+(i<w.length-1||R?' ':''))}
let QT=null;
function passes(r,skip){
 for(const[k,f]of Object.entries(state.filters)){if(k===skip||!f.size)continue;if(!DIMS[k].get(r).some(v=>f.has(v)))return false}
 if(state.favOnly&&!favs.has(r.id))return false;
 const st=status(r);
 if(state.hidePast&&st==='past')return false;
 if(state.quick){const n=nowMs(),today=baliDate(),tom=baliDate(n+24*H);
  if(state.quick==='now'&&!(st==='live'||st==='soon'))return false;
  if(state.quick==='tonight'&&!(r.date===today&&r.debut&&r.debut>='17:00'))return false;
  if(state.quick==='tomorrow'&&r.date!==tom)return false}
 if(QT&&!QT.every(t=>r.s.includes(t)))return false;
 return true;
}
const activeCount=()=>Object.values(state.filters).filter(v=>v.size).length+(state.favOnly?1:0)+(state.quick?1:0);
function cmp(a,b){
 for(const s of [state.sort,{k:'when',d:1}]){const ka=SORTS[s.k](a),kb=SORTS[s.k](b);const ea=ka==null||ka==='',eb=kb==null||kb==='';if(ea&&eb)continue;if(ea)return 1;if(eb)return-1;
  const r=typeof ka==='number'?ka-kb:String(ka).localeCompare(String(kb),lang,{numeric:true,sensitivity:'base'});if(r)return r*s.d}
 return 0;
}

const sc=(v,big)=>v==null?'<span class="sc na">–</span>':`<span class="sc ${v>=7?'hi':v>=4?'md':'lo'}${big?' big':''}">${v}</span>`;
function stBadge(r){const s=status(r);if(s==='live')return`<span class="st live">${T().live}</span>`;if(s==='soon'){const m=Math.round((r.t0-nowMs())/60000);return`<span class="st soon">${m<60?fmt(T().soon,{m}):fmt(T().soonH,{h:Math.round(m/60)})}</span>`}return''}
const timeStr=r=>r.debut?(r.debut+(r.fin?'–'+r.fin:'')):'—';
const dot=r=>r.fiabK?`<span class="dot d-${r.fiabK}" title="${esc(T().cols.fiab+' : '+(T().fiab[r.fiab]||r.fiab))}" role="img" aria-label="${esc(T().fiab[r.fiab]||r.fiab)}"></span>`:'';
const favBtn=r=>`<button class="fav" data-fav="${r.id}" aria-pressed="${favs.has(r.id)}" aria-label="${T().fav}">${favs.has(r.id)?'★':'☆'}</button>`;
function detail(r){
 const t=T(),ad=[tx(r,'lieu'),tx(r,'adresse')].filter(Boolean).join(' — ');
 return`<div class="detg"><div><p class="k">${t.desc}</p><p>${esc(tx(r,'desc'))||'—'}</p><p class="k">${t.details}</p><p>${esc(tx(r,'details'))||'—'}</p></div>
 <div><p class="k">${t.place}</p><p>${esc(ad)||'—'}</p>
 <p class="k">${t.price}</p><p>${esc(tx(r,'prix'))||'—'}</p>
 <p class="k">${t.links}</p><p class="links">${r.urls.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(r.srcRaw[i]||(lang==='fr'?'Lien ':'Link ')+(i+1))} ↗</a>`).join(' · ')||'—'}</p>
 <div class="acts"><a class="pri" href="${esc(r.maps)}" target="_blank" rel="noopener">📍 ${t.maps}</a>${r.t0?`<button data-ics="${r.id}">📅 ${t.ics}</button>`:''}${navigator.share?`<button data-share="${r.id}">↗ ${t.share}</button>`:''}</div></div></div>`;
}
const isDesk=()=>matchMedia('(min-width:900px)').matches;
const grouped=()=>state.sort.k==='when';
const dayCount=rows=>{const c={};rows.forEach(r=>c[r.date]=(c[r.date]||0)+1);return c};

function cardHTML(r){const t=T(),o=state.open.has(r.id),st=status(r);return `<li class="card${o?' open':''}${st==='past'?' past':''}" data-row="${r.id}">
  <div class="c1"><span class="time">${grouped()?'':dayLabel(r.date,true)+' · '}${timeStr(r)}</span>${stBadge(r)}</div>
  <div class="cright">${sc(r.avg,1)}${favBtn(r)}</div>
  <button class="c2" data-open="${r.id}" aria-expanded="${o}">${esc(tx(r,'nom'))}</button>
  <div class="c3">${dot(r)} ${esc([tx(r,'lieu'),dimLabel('zone',r.zone)].filter(Boolean).join(' · '))}</div>
  <div class="c4">${r.cat?`<span class="tag">${esc(dimLabel('cat',r.cat))}</span>`:''}<span class="tag price">${esc(dimLabel('budget',r.budget))}</span></div>
  <div class="c5"><span>${t.short.meet}${sc(r.meet)}</span><span>${t.short.disc}${sc(r.disc)}</span><span>${t.short.fun}${sc(r.fun)}</span><span>${t.short.val}${sc(r.val)}</span></div>
  ${o?detail(r):''}</li>`}
function renderCards(rows){
 const t=T(),dc=dayCount(rows);let h='',last=null;
 for(const r of rows){
  if(grouped()&&r.date!==last){if(last)h+='</ul>';last=r.date;h+=`<h2 class="cday">${dayLabel(r.date)}<span>${dc[r.date]}</span></h2><ul class="cards">`}
  else if(!grouped()&&last===null){last='x';h+='<ul class="cards">'}
  h+=cardHTML(r);
 }
 return h+(last?'</ul>':'');
}
function rowHTML(r){const o=state.open.has(r.id),st=status(r);return `<tr class="ev${o?' open':''}${st==='past'?' past':''}" data-row="${r.id}"><td>${favBtn(r)}</td><td class="when">${grouped()?'':`<small>${dayLabel(r.date,true)}</small>`}${timeStr(r)}</td>
  <td><div class="nm"><button class="namebtn" data-open="${r.id}" aria-expanded="${o}">${esc(tx(r,'nom'))}</button>${dot(r)}${stBadge(r)}</div><div class="sub">${esc(tx(r,'lieu'))}</div></td>
  <td>${r.cat?`<span class="tag">${esc(dimLabel('cat',r.cat))}</span>`:''}</td><td>${esc(dimLabel('zone',r.zone))}</td>
  <td title="${esc(tx(r,'prix'))}">${esc(dimLabel('budget',r.budget))}</td>
  <td>${sc(r.meet)}</td><td>${sc(r.disc)}</td><td>${sc(r.fun)}</td><td>${sc(r.val)}</td><td>${sc(r.avg,1)}</td>
  <td>${r.fiab?`<span class="tag">${esc(dimLabel('fiab',r.fiab))}</span>`:''}</td></tr>`+(o?`<tr class="det" data-det="${r.id}"><td colspan="${COLS.length}">${detail(r)}</td></tr>`:'')}
function renderTable(rows){
 const t=T(),dc=dayCount(rows);
 let h='<table><thead><tr>'+COLS.map(c=>{
  if(c.k==='fav')return'<th style="width:40px"><span class="vh">★</span></th>';
  const s=state.sort.k===c.k,f=c.f&&state.filters[c.f],lbl=c.s?t.short[c.k]:t.cols[c.k];
  return`<th aria-sort="${s?(state.sort.d>0?'ascending':'descending'):'none'}"><div class="h"><button class="sort" data-sort="${c.k}" title="${esc(t.cols[c.k])}">${lbl}${s?`<span class="arr">${state.sort.d>0?'▲':'▼'}</span>`:''}</button>${c.f&&DIMS[c.f].filterable?`<button class="fb${f&&f.size?' on':''}" data-pop="${c.f}" aria-haspopup="dialog" aria-label="${esc(t.filterOn+t.cols[c.f])}">▾${f&&f.size?f.size:''}</button>`:''}</div></th>`}).join('')+'</tr></thead><tbody>';
 let last=null;
 for(const r of rows){
  if(grouped()&&r.date!==last){last=r.date;h+=`<tr class="day"><td colspan="${COLS.length}">${dayLabel(r.date)}<span>${dc[r.date]}</span></td></tr>`}
  h+=rowHTML(r);
 }
 return h+'</tbody></table>';
}
function renderChips(){const t=T();
 const fj=state.filters.jour,noDay=!(fj&&fj.size)&&!state.quick&&!state.favOnly;
 document.getElementById('chips').innerHTML=`<button class="chip" data-chip="all" aria-pressed="${noDay}">${t.all}</button>`+
  ['now','tonight','tomorrow'].map(k=>`<button class="chip q" data-quick="${k}" aria-pressed="${state.quick===k}">${t[k]}</button>`).join('')+'<span class="sep"></span>'+
  DATES.map(d=>`<button class="chip" data-day="${d}" aria-pressed="${!!(fj&&fj.has(d))}">${dayLabel(d,true)}</button>`).join('')+'<span class="sep"></span>'+
  `<button class="chip" data-favonly aria-pressed="${state.favOnly}">${t.favs}${favs.size?' '+favs.size:''}</button>`;
}
function renderChrome(){
 const t=T();
 document.documentElement.lang=lang;document.title=t.title;
 document.getElementById('title').innerHTML=`${t.title}<small>${fmt(t.sub,{n:DATA.length})}</small>`;
 document.getElementById('helpS').textContent=t.helpS;document.getElementById('helpP').textContent=t.helpP;
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
 document.getElementById('q').placeholder=t.search;document.getElementById('qL').textContent=t.searchL;
}
function render(){
 const t=T();QT=qTerms();
 const rows=DATA.filter(r=>passes(r)).sort(cmp);
 const cnt=fmt(t.count,{a:rows.length,b:DATA.length});
 document.getElementById('count').textContent=cnt;document.getElementById('countD').textContent=cnt;
 renderChips();
 const n=Object.entries(state.filters).filter(([k,v])=>v.size&&k!=='jour').length;
 const fb=document.getElementById('fbtn');fb.classList.toggle('on',n>0);fb.innerHTML=`<span aria-hidden="true">☰</span> ${t.filters}${n?`<span class="n">${n}</span>`:''}`;
 document.querySelectorAll('[data-qf]').forEach(b=>{const k=b.dataset.qf,f=state.filters[k];b.classList.toggle('on',!!(f&&f.size));b.textContent=t.cols[k]+(f&&f.size?` (${f.size})`:'')+' ▾'});
 document.getElementById('af').innerHTML=Object.entries(state.filters).filter(([k,v])=>v.size&&k!=='jour').map(([k,v])=>`<button data-rmf="${k}" aria-label="${t.remove}"><b>${t.cols[k]}</b> ${esc([...v].slice(0,2).map(x=>dimLabel(k,x)).join(', '))}${v.size>2?' +'+(v.size-2):''} ✕</button>`).join('')+(state.q?`<button data-rmq><b>⌕</b> “${esc(state.q)}” ✕</button>`:'');
 document.getElementById('qc').hidden=!state.q;
 const m=document.getElementById('main');
 m.innerHTML=rows.length?(isDesk()?renderTable(rows):renderCards(rows)):`<div class="empty">${t.none}<br><button class="fbtn" data-resetall>${t.reset}</button></div>`;
 if(sheet)drawSheet();
 save();
}
function full(){renderChrome();render()}

// ---------- panneau « Filtres » (tout en un) ----------
let sheet=null,scrim=null;
function openSheet(){
 closeAll();const t=T();
 scrim=document.createElement('div');scrim.className='scrim';scrim.onclick=closeAll;document.body.appendChild(scrim);
 sheet=document.createElement('div');sheet.className='sheet';sheet.setAttribute('role','dialog');sheet.setAttribute('aria-modal','true');sheet.setAttribute('aria-label',t.filters);
 sheet.innerHTML=`<div class="sh-h"><b>${t.filters}</b><button data-close aria-label="${t.close}">×</button></div><div class="sh-b"></div><div class="sh-f"><button class="ghost" data-resetall>${t.reset}</button><button class="go" data-close></button></div>`;
 document.body.appendChild(sheet);document.body.style.overflow='hidden';
 sheet.addEventListener('click',e=>{
  if(e.target.closest('[data-close]'))return closeAll();
  if(e.target.closest('[data-resetall]'))return resetAll();
  const sb=e.target.closest('[data-sortk]');if(sb){const k=sb.dataset.sortk;state.sort={k,d:DESC_FIRST.includes(k)?-1:1};return render()}
  const cl=e.target.closest('[data-clr]');if(cl){delete state.filters[cl.dataset.clr];return render()}
  const p=e.target.closest('[data-dim]');if(p){const k=p.dataset.dim,v=p.dataset.v,f=state.filters[k]||(state.filters[k]=new Set());f.has(v)?f.delete(v):f.add(v);if(!f.size)delete state.filters[k];if(k==='jour')state.quick=null;return render()}
 });
 sheet.addEventListener('change',e=>{if(e.target.id==='hp'){state.hidePast=e.target.checked;render()}});
 drawSheet();sheet.querySelector('[data-close]').focus();
}
function drawSheet(){
 const t=T(),b=sheet.querySelector('.sh-b'),st=b.scrollTop;
 const catSec=secHTML('cat');let h=catSec+`<div class="sec"><h3>${t.cols.sort}</h3><div class="pills">${Object.entries(t.sorts).map(([k,l])=>`<button class="pill" data-sortk="${k}" aria-pressed="${state.sort.k===k}">${l}</button>`).join('')}</div></div>
`;
 for(const k of SHEET_DIMS.slice(1))h+=secHTML(k);
 h+=`<div class="sec"><h3>${t.cols.show}</h3><label class="tgl">${t.hidePast}<input type="checkbox" id="hp"${state.hidePast?' checked':''}></label></div>`;
 b.innerHTML=h;b.scrollTop=st;
 sheet.querySelector('.go').textContent=fmt(t.seeN,{n:DATA.filter(r=>passes(r)).length});
}
function secHTML(k){const t=T(),d=DIMS[k];if(!d.filterable)return'';
  const c={};DATA.filter(r=>passes(r,k)).forEach(r=>d.get(r).forEach(v=>c[v]=(c[v]||0)+1));const f=state.filters[k];
  return`<div class="sec"><h3>${t.cols[k]}${f&&f.size?`<button data-clr="${k}">${t.clearSec}</button>`:''}</h3><div class="pills">${dimKeys(k).map(v=>`<button class="pill${c[v]?'':' zero'}" data-dim="${k}" data-v="${esc(v)}" aria-pressed="${!!(f&&f.has(v))}">${esc(dimLabel(k,v))}<span class="n">${c[v]||0}</span></button>`).join('')}</div></div>`}

// ---------- popover de colonne (bureau) ----------
let pop=null,popK=null,popY=0;
function openPop(k,btn){
 if(pop&&popK===k){closeAll();return}
 closeAll();popK=k;popY=scrollY;const d=DIMS[k],t=T();
 const c={};DATA.filter(r=>passes(r,k)).forEach(r=>d.get(r).forEach(v=>c[v]=(c[v]||0)+1));
 const keys=dimKeys(k),sel=new Set(state.filters[k]||[]);
 pop=document.createElement('div');pop.className='pop';pop.setAttribute('role','dialog');pop.setAttribute('aria-label',t.filterOn+t.cols[k]);
 pop.innerHTML=`<div class="ph"><b>${t.cols[k]}</b>${keys.length>8?`<input type="search" placeholder="${t.findVal}">`:''}<div class="pa"><button data-a="all">${t.checkAll}</button><button data-a="none">${t.checkNone}</button></div></div><div class="pl"></div><div class="pf"><button></button></div>`;
 const pl=pop.querySelector('.pl'),ok=pop.querySelector('.pf button'),fi=pop.querySelector('.ph input');
 const draw=()=>{const fl=(fi?.value||'').toLowerCase();const cc={};DATA.filter(r=>passes(r,k)).forEach(r=>d.get(r).forEach(v=>cc[v]=(cc[v]||0)+1));
  pl.innerHTML=keys.filter(v=>dimLabel(k,v).toLowerCase().includes(fl)).map(v=>`<label class="${cc[v]?'':'zero'}"><input type="checkbox" value="${esc(v)}"${sel.has(v)?' checked':''}><span>${esc(dimLabel(k,v))}</span><span class="n">${cc[v]||0}</span></label>`).join('');
  ok.textContent=fmt(t.seeN,{n:DATA.filter(r=>passes(r)).length})};
 const apply=()=>{if(sel.size)state.filters[k]=new Set(sel);else delete state.filters[k];render();draw()};
 pl.addEventListener('change',e=>{const v=e.target.value;e.target.checked?sel.add(v):sel.delete(v);apply()});
 pop.querySelector('.pa').addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;if(a==='all')pl.querySelectorAll('input').forEach(i=>sel.add(i.value));else sel.clear();apply()});
 fi?.addEventListener('input',draw);ok.onclick=closeAll;
 document.body.appendChild(pop);draw();
 const r=btn.getBoundingClientRect(),ph=Math.min(pop.offsetHeight,innerHeight-16);pop.style.maxHeight=ph+'px';pop.style.top=Math.max(8,Math.min(r.bottom+4,innerHeight-ph-8))+'px';pop.style.left=Math.max(16,Math.min(r.left-80,innerWidth-pop.offsetWidth-16))+'px';
 (fi||pl.querySelector('input'))?.focus({preventScroll:true});
}
function closeAll(){if(pop){pop.remove();pop=null;popK=null}if(sheet){sheet.remove();sheet=null;document.body.style.overflow='';document.getElementById('fbtn').focus({preventScroll:true})}if(scrim){scrim.remove();scrim=null}}
function resetAll(){state.filters={};state.q='';document.getElementById('q').value='';state.quick=null;state.favOnly=false;state.sort=DEF_SORT();state.open.clear();render()}

function fold(l){const enc=new TextEncoder();let out='',cur='',n=0;for(const ch of l){const b=enc.encode(ch).length;if(n+b>(out?74:75)){out+=(out?'\r\n ':'')+cur;cur='';n=0}cur+=ch;n+=b}return out?out+'\r\n '+cur:cur}
function ics(r){
 const f=ms=>new Date(ms).toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
 const e=s=>String(s||'').replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
 const body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//canggu-events//EN','BEGIN:VEVENT',`UID:${r.id}@canggu-events`,`DTSTAMP:${f(Date.now())}`,`DTSTART:${f(r.t0)}`,`DTEND:${f(r.t1)}`,`SUMMARY:${e(tx(r,'nom'))}`,`LOCATION:${e([tx(r,'lieu'),tx(r,'adresse')].filter(Boolean).join(', '))}`,`DESCRIPTION:${e(tx(r,'desc')+'\n'+(r.urls[0]||''))}`,`URL:${r.urls[0]||r.maps}`,'END:VEVENT','END:VCALENDAR'].map(fold).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'text/calendar'}));a.download=(tx(r,'nom')||'event').replace(/[^\w-]+/g,'_').slice(0,40)+'.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

const byId=Object.fromEntries(DATA.map(r=>[r.id,r]));
function toggle(id){state.open.has(id)?state.open.delete(id):state.open.add(id);
 const r=byId[id],el=document.querySelector(`[data-row="${id}"]`);if(!el)return render();
 if(isDesk()){const nx=el.nextElementSibling;if(nx&&nx.dataset.det===id)nx.remove();el.outerHTML=rowHTML(r)}else el.outerHTML=cardHTML(r);
 document.querySelector(`[data-open="${id}"]`)?.focus({preventScroll:true});save()}
document.getElementById('main').addEventListener('click',e=>{
 const s=e.target.closest('[data-sort]');if(s){const k=s.dataset.sort;if(state.sort.k===k){if(state.sort.f){state.sort=DEF_SORT()}else{state.sort.d=-state.sort.d;state.sort.f=1}}else state.sort={k,d:DESC_FIRST.includes(k)?-1:1};render();return}
 const p=e.target.closest('[data-pop]');if(p){openPop(p.dataset.pop,p);return}
 if(e.target.closest('[data-resetall]'))return resetAll();
 const fv=e.target.closest('[data-fav]');if(fv){const id=fv.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);if(state.favOnly)return render();document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>{b.setAttribute('aria-pressed',favs.has(id));b.textContent=favs.has(id)?'★':'☆'});renderChips();save();return}
 const ic=e.target.closest('[data-ics]');if(ic){ics(byId[ic.dataset.ics]);return}
 const sh=e.target.closest('[data-share]');if(sh){const r=byId[sh.dataset.share];navigator.share({title:tx(r,'nom'),text:`${dayLabel(r.date)} ${timeStr(r)} — ${tx(r,'lieu')||''}`,url:r.urls[0]||r.maps}).catch(()=>{});return}
 if(e.target.closest('a'))return;
 // dans le détail ouvert, un clic ne referme pas (sélection de texte possible)
 if(e.target.closest('.detg')||e.target.closest('tr.det'))return;
 const row=e.target.closest('[data-row]');if(!row)return;const sel=getSelection();
 if(e.detail&&!e.target.closest('[data-open]')&&sel&&!sel.isCollapsed&&sel.containsNode(row,true))return;
 toggle(row.dataset.row);
});
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;
 if(b.dataset.chip==='all'){delete state.filters.jour;state.quick=null;state.favOnly=false}
 else if(b.dataset.quick){state.quick=state.quick===b.dataset.quick?null:b.dataset.quick;if(state.quick)delete state.filters.jour}
 else if(b.dataset.day){state.quick=null;const f=state.filters.jour||(state.filters.jour=new Set());f.has(b.dataset.day)?f.delete(b.dataset.day):f.add(b.dataset.day);if(!f.size)delete state.filters.jour}
 else if(b.hasAttribute('data-favonly'))state.favOnly=!state.favOnly;
 render()});
document.querySelectorAll('[data-qf]').forEach(b=>b.addEventListener('click',()=>openPop(b.dataset.qf,b)));
document.getElementById('fbtn').addEventListener('click',openSheet);
document.getElementById('af').addEventListener('click',e=>{const b=e.target.closest('[data-rmf]');if(b){delete state.filters[b.dataset.rmf];render()}if(e.target.closest('[data-rmq]')){state.q='';q.value='';render()}});
const q=document.getElementById('q');q.value=state.q;let qt;
q.addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=q.value;render()},150)});
q.addEventListener('keydown',e=>{if(e.key==='Enter')q.blur()});
document.getElementById('qc').addEventListener('click',()=>{state.q='';q.value='';render();q.focus()});
document.querySelector('.lang').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.dataset.l!==lang){lang=b.dataset.l;closeAll();full()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
document.addEventListener('mousedown',e=>{if(pop&&!pop.contains(e.target)&&!e.target.closest('[data-pop],[data-qf]'))closeAll()});
addEventListener('scroll',()=>{if(pop&&Math.abs(scrollY-popY)>60)closeAll()},{passive:true});
const tb=document.getElementById('tb');const setTb=()=>document.documentElement.style.setProperty('--tb-h',(tb.classList.contains('hide')?0:tb.offsetHeight)+'px');new ResizeObserver(setTb).observe(tb);
let lastY=scrollY;addEventListener('scroll',()=>{const y=scrollY,d=y-lastY;if(Math.abs(d)<10)return;
 const tbTop=document.querySelector('.help').getBoundingClientRect().bottom+y;const hide=!isDesk()&&d>0&&y>tbTop+tb.offsetHeight+120&&!sheet;if(hide&&document.activeElement===q)q.blur();
 if(hide!==tb.classList.contains('hide')){tb.classList.toggle('hide',hide);setTb()}lastY=y},{passive:true});
q.addEventListener('focus',()=>{if(!isDesk()){tb.classList.remove('hide');setTb();const top=document.querySelector('.help').getBoundingClientRect().bottom+scrollY;if(scrollY<top)scrollTo({top,behavior:'smooth'})}});
let wasDesk=isDesk();addEventListener('resize',()=>{if(isDesk()!==wasDesk){wasDesk=isDesk();closeAll();render()}});
setInterval(()=>{const sel=getSelection();if(!pop&&!sheet&&(!sel||sel.isCollapsed)&&!document.getElementById('main').contains(document.activeElement)&&document.activeElement!==q)render()},60000);
full();
</script>
</body>
</html>
