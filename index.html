function renderHead(){
 document.getElementById('hd').innerHTML=COLS.map(c=>{const s=state.sort[0]&&state.sort[0].k===c.k?state.sort[0]:null;const f=state.filters[c.k];
  return`<th><div class="h"><span class="lbl" data-k="${c.k}">${c.l}${s?`<span class="arr">${s.d>0?'▲':'▼'}</span>`:''}</span>${c.filterable?`<button class="fbtn${f&&f.size?' on':''}" data-k="${c.k}" title="Filtrer">▾${f&&f.size?f.size:''}</button>`:''}</div></th>`}).join('');
}
function render(){
 renderHead();
 const rows=DATA.filter(r=>passes(r)).sort(cmp);
 document.getElementById('count').textContent=`${rows.length} / ${DATA.length} événements`;
 const bd=document.getElementById('bd');
 if(!rows.length){bd.innerHTML=`<tr><td colspan="${COLS.length}" class="empty">Aucun événement ne correspond aux filtres.</td></tr>`}
 else bd.innerHTML=rows.map(r=>{const id=DATA.indexOf(r);const o=state.open.has(id);
  let h=`<tr class="ev${o?' open':''}" data-id="${id}">${COLS.map(c=>`<td class="${c.cls||''}">${cell(r,c)}</td>`).join('')}</tr>`;
  if(o)h+=`<tr class="det"><td colspan="${COLS.length}"><div class="det-grid"><div><p class="k">Description</p><p>${esc(r.desc)||'—'}</p><p class="k">Détails</p><p>${esc(r.details)||'—'}</p></div><div><p class="k">Lieu</p><p>${esc(r.lieu)}${r.adresse?' — '+esc(r.adresse):''}${r.zone?' ('+esc(r.zone)+')':''}</p><p><a href="${esc(r.maps)}" target="_blank" rel="noopener">Ouvrir dans Google Maps</a></p><p class="k">Pages de l'événement</p><p>${r.urls.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(r.sources[i]||'lien '+(i+1))}</a>`).join('<br>')||'—'}</p></div></div></td></tr>`;
  return h}).join('');
 // puces de jour
 const fj=state.filters.jour;
 document.getElementById('days').innerHTML=['Tous',...Object.keys(COLS[0].counts).sort((a,b)=>DATA.find(r=>r.jour===a).date.localeCompare(DATA.find(r=>r.jour===b).date))].map(d=>`<button class="chip${(d==='Tous'?!(fj&&fj.size):fj&&fj.has(d))?' on':''}" data-d="${d}">${d}</button>`).join('');
 // filtres actifs
 document.getElementById('af').innerHTML=Object.entries(state.filters).filter(([k,v])=>v.size).map(([k,v])=>`<span class="af" data-k="${k}" title="Retirer"><b>${COLS.find(c=>c.k===k).l}</b> : ${esc([...v].slice(0,4).join(', '))}${v.size>4?' …':''} ✕</span>`).join('');
 save();
}
document.getElementById('hd').addEventListener('click',e=>{
 const l=e.target.closest('.lbl');if(l){const k=l.dataset.k,c=COLS.find(x=>x.k===k);if(c.nosort)return;const cur=state.sort[0];
  if(cur&&cur.k===k){if(!cur.f){cur.d=-cur.d;cur.f=1}else state.sort=[{k:'jour',d:1},{k:'debut',d:1}]}
  else state.sort=[{k,d:c.score?-1:1},{k:'jour',d:1},{k:'debut',d:1}];
  render();return}
 const b=e.target.closest('.fbtn');if(b)openPop(b.dataset.k,b);
});
document.getElementById('bd').addEventListener('click',e=>{const tr=e.target.closest('tr.ev');if(!tr)return;const id=+tr.dataset.id;state.open.has(id)?state.open.delete(id):state.open.add(id);render()});
document.getElementById('days').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const d=b.dataset.d;
 if(d==='Tous')delete state.filters.jour;else{const f=state.filters.jour||(state.filters.jour=new Set());f.has(d)?f.delete(d):f.add(d)}render()});
document.getElementById('af').addEventListener('click',e=>{const a=e.target.closest('.af');if(a){delete state.filters[a.dataset.k];render()}});
const q=document.getElementById('q');q.value=state.q;q.addEventListener('input',()=>{state.q=q.value.trim();render()});
document.getElementById('reset').onclick=()=>{state.filters={};state.q='';q.value='';state.sort=[{k:'jour',d:1},{k:'debut',d:1}];state.open.clear();render()};

let pop=null;
function closePop(){if(pop){pop.remove();pop=null}}
function openPop(k,btn){
 closePop();const c=COLS.find(x=>x.k===k);
 // nombre d'événements par valeur, compte tenu des autres filtres actifs
 const cnt={};DATA.filter(r=>passes(r,k)).forEach(r=>vals(r,c).forEach(v=>cnt[v]=(cnt[v]||0)+1));
 let keys=Object.keys(c.counts);
 keys.sort(c.score?(a,b)=>(b==='(vide)')-(a==='(vide)')||+b-+a:k==='jour'?(a,b)=>DATA.find(r=>r.jour===a).date.localeCompare(DATA.find(r=>r.jour===b).date):(a,b)=>(cnt[b]||0)-(cnt[a]||0)||a.localeCompare(b,'fr'));
 const sel=new Set(state.filters[k]||[]);
 pop=document.createElement('div');pop.className='pop';
 pop.innerHTML=`<div class="ph"><b>${c.l}</b>${keys.length>8?'<input type="search" placeholder="Chercher une valeur…">':''}<div class="pa"><a data-a="all">Tout cocher</a><a data-a="none">Tout décocher</a></div></div><div class="pl"></div><div class="pf"><button>OK</button></div>`;
 const pl=pop.querySelector('.pl');
 const draw=(flt='')=>{pl.innerHTML=keys.filter(v=>v.toLowerCase().includes(flt.toLowerCase())).map(v=>`<label><input type="checkbox" value="${esc(v)}"${sel.has(v)?' checked':''}><span>${esc(v)}</span><span class="n">${cnt[v]||0}</span></label>`).join('')};
 draw();
 pl.addEventListener('change',e=>{const v=e.target.value;e.target.checked?sel.add(v):sel.delete(v);apply()});
 const apply=()=>{if(sel.size)state.filters[k]=new Set(sel);else delete state.filters[k];render()};
 pop.querySelector('.pa').addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;if(a==='all')pl.querySelectorAll('input').forEach(i=>sel.add(i.value));else sel.clear();draw(pop.querySelector('.ph input')?.value||'');apply()});
 pop.querySelector('.ph input')?.addEventListener('input',e=>draw(e.target.value));
 pop.querySelector('.pf button').onclick=closePop;
 document.body.appendChild(pop);
 const r=btn.getBoundingClientRect();pop.style.top=Math.min(r.bottom+4,innerHeight-200)+'px';pop.style.left=Math.max(16,Math.min(r.left-200,innerWidth-pop.offsetWidth-16))+'px';
}
document.addEventListener('mousedown',e=>{if(pop&&!pop.contains(e.target)&&!e.target.closest('.fbtn'))closePop()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});
render();
</script>
</body>
</html>
